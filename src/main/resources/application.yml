spring:
  application:
    name: ms-foodcourt-users
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodcourt_users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
  api-docs:
    enabled: false
clients:
  foodcourt:
    base-url: ${FOODCOURT_SERVICE_URL:http://localhost:8082/api/v1}
    connect-timeout: ${FOODCOURT_CONNECT_TIMEOUT:2s}
    read-timeout: ${FOODCOURT_READ_TIMEOUT:3s}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1h}
